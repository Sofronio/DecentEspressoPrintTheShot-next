name: Build PrintTheShot Next

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 桌面三平台 / the three desktop platforms
  # --------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        # 只列 include:macOS 要出两个架构,不能再用 os 简写列表 —— 那样两个
        # macOS 条目会互相覆盖,只剩一个。
        #
        # include only: macOS needs two architectures, and the short `os:` list form
        # cannot express that — the two macOS entries would collapse into one.
        include:
          - os: ubuntu-latest
            artifact: PrintTheShotNext-linux-x64
            script: scripts/build_linux.sh

          # Apple Silicon。GitHub 的 macos-latest / macos-14 / macos-15 都是 arm64。
          # Apple Silicon: macos-latest, macos-14 and macos-15 are all arm64 on
          # GitHub-hosted runners.
          - os: macos-latest
            artifact: PrintTheShotNext-macos-arm64
            macos_arch: arm64
            script: scripts/build_macos.sh

          # Intel。必须显式点名 -intel 后缀的 runner,否则拿到的还是 arm64 机器,
          # 打出来的包在 Intel Mac 上根本跑不起来。
          # Intel: the -intel suffix has to be explicit, or you get an arm64 machine
          # again and the result cannot run on an Intel Mac at all.
          - os: macos-15-intel
            artifact: PrintTheShotNext-macos-intel
            macos_arch: intel
            script: scripts/build_macos.sh

          - os: windows-latest
            artifact: PrintTheShotNext-windows-x64.exe
            script: scripts/build_windows.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            bash -lc "cd \$GITHUB_WORKSPACE && ./scripts/build_windows.bat"
          else
            bash -lc "cd \$GITHUB_WORKSPACE && chmod +x ${{ matrix.script }} && ./${{ matrix.script }}"
          fi

      - name: Verify the macOS build is signed and the right architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP=dist/PrintTheShot.app
          [ -d "$APP" ] || { echo "::error::dist/PrintTheShot.app 不存在"; exit 1; }

          # 架构必须和这个 runner 对上。跑错 runner 的话产物架构就错了,而那种
          # 错误只有从 Releases 页面下载的人才会遇到 —— 在这里挡住。
          # The architecture must match this runner. A wrong runner produces a wrong
          # architecture, and that mistake only surfaces for whoever downloads it —
          # so block it here.
          echo "期望架构 / expected: ${{ matrix.macos_arch }}"
          ACTUAL=$(lipo -archs "$APP/Contents/MacOS/PrintTheShot")
          echo "实际架构 / actual  : $ACTUAL"
          case "${{ matrix.macos_arch }}" in
            arm64) [ "$ACTUAL" = "arm64" ] || { echo "::error::期望 arm64,实际 $ACTUAL"; exit 1; } ;;
            intel) [ "$ACTUAL" = "x86_64" ] || { echo "::error::期望 x86_64,实际 $ACTUAL"; exit 1; } ;;
          esac

          # 签名必须有效 —— 这条挡住的是「下载者看到已损坏」那个历史问题。
          # The signature must be valid: this stops the "downloaders see it as
          # damaged" failure from coming back.
          codesign --verify --verbose=2 "$APP"
          echo "✅ 架构与签名都正确 / architecture and signature both good"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/PrintTheShot
            dist/PrintTheShot.exe
            dist/PrintTheShot-macos.zip
          if-no-files-found: error   # 构建失败必须显式暴露

  # --------------------------------------------------------------------------
  # Android APK
  # --------------------------------------------------------------------------
  # 单独一个 job 而不是塞进上面的矩阵:它的步骤完全不同(Java + Android SDK +
  # Node + Gradle),复用不到矩阵里的任何东西,硬塞进去只会让两边都难读。
  #
  # A separate job rather than another matrix entry: the steps are entirely
  # different (Java + Android SDK + Node + Gradle) and none of the matrix helps.
  # Forcing it in would make both harder to read.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 6 要 JDK 17。ubuntu-latest 预装的是 JDK 11/21,所以显式装。
      # Capacitor 6 needs JDK 17; ubuntu-latest ships 11/21, so install it.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # GitHub 的 ubuntu 镜像自带 Android SDK,并且 licenses 已接受。
      # GitHub's ubuntu image ships the Android SDK with licences already accepted.
      - name: Show toolchain
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          node --version

      - name: Build APK
        run: |
          chmod +x scripts/build_android.sh
          ./scripts/build_android.sh debug

      - name: Verify the APK
        run: |
          set -e
          APK=PrintTheShotNext-debug.apk
          [ -f "$APK" ] || { echo "::error::$APK 未生成"; exit 1; }

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          [ -n "$AAPT" ] || { echo "::error::找不到 aapt2"; exit 1; }

          LABEL=$("$AAPT" dump badging "$APK" | sed -n "s/^application-label:'\(.*\)'/\1/p")
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "包名 / package: $PKG"
          echo "应用名 / label : $LABEL"
          [ "$LABEL" = "PrintTheShotNext" ] || { echo "::error::应用名不对: $LABEL"; exit 1; }

          # Web 资源和字体必须真的打进包里 —— 少一样,用户装上就是白屏。
          # The web assets and the font must actually be inside: miss one and the app
          # shows a blank screen once installed.
          for f in assets/public/index.html assets/public/app.js assets/public/strings.js \
                   assets/public/bt.js assets/public/fonts/NotoSansCJKsc-Regular.otf; do
            unzip -l "$APK" | grep -q "$f" || { echo "::error::APK 缺少 $f"; exit 1; }
          done
          echo "✅ APK 校验通过 / APK verified"

      - uses: actions/upload-artifact@v4
        with:
          name: PrintTheShotNext-android
          path: PrintTheShotNext-debug.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Release
  # --------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      # 必须先 checkout:release 正文取自仓库里的 docs/RELEASE_NOTES.md,
      # 而下面这些步骤默认跑在一个没有工作区的 runner 上。
      #
      # Checkout first: the release body is read from docs/RELEASE_NOTES.md in the
      # repository, and the runner has no working tree otherwise.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check release notes are current
        run: |
          set -e
          NOTES=docs/RELEASE_NOTES.md
          VERSION="${GITHUB_REF_NAME#v}"

          # 两道检查,因为「空正文」和「正文没更新」是两种不同的失误:
          # v2.1-beta.2 就是空着发出去的 —— 一个没有任何说明的 Release,而没人发现。
          #
          # Two checks, because "empty body" and "body not updated" are different
          # mistakes. v2.1-beta.2 went out with an empty body — a release with no
          # description at all — and nothing caught it.
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES 不存在或为空 / does not exist or is empty"
            exit 1
          fi

          # 只检查「非空」不够:忘了更新的话,会把上一个版本的说明原样发出去。
          # 因此要求正文必须提到本次的版本号。
          #
          # Non-empty is not enough: forgetting to update would republish the previous
          # release's notes verbatim. So require it to mention this release's version.
          if ! grep -qF "$VERSION" "$NOTES"; then
            echo "::error::$NOTES 没有提到 $VERSION —— 发布前请更新 / does not mention $VERSION — update it before tagging"
            exit 1
          fi

          echo "✅ 发布说明已就绪 / release notes ready: $VERSION"

      - name: Prepare release files
        run: |
          set -e
          mkdir -p release
          cp artifacts/PrintTheShotNext-linux-x64/PrintTheShot            release/PrintTheShotNext-linux
          cp artifacts/PrintTheShotNext-windows-x64.exe/PrintTheShot.exe  release/PrintTheShotNext-windows-x64.exe

          # 两个 macOS 包必须改成不同的名字。中间那个 zip 在两个 artifact 里同名
          # (都叫 dist/PrintTheShot-macos.zip),直接 cp 会让后一个覆盖前一个,
          # 结果 Release 上只剩一个架构,而且没人会发现。
          #
          # The two macOS builds must be renamed: the inner zip has the same name in
          # both artifacts, so a plain cp would let the second overwrite the first,
          # leaving one architecture on the release with nothing to indicate it.
          cp artifacts/PrintTheShotNext-macos-arm64/PrintTheShot-macos.zip release/PrintTheShotNext-macos-arm64.zip
          cp artifacts/PrintTheShotNext-macos-intel/PrintTheShot-macos.zip release/PrintTheShotNext-macos-intel.zip

          cp artifacts/PrintTheShotNext-android/PrintTheShotNext-debug.apk release/PrintTheShotNext-android.apk

          echo "--- 待发布文件 / files to release ---"
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # 不写 body: 也不开 generate_release_notes —— 两者都试过,前者是空的,
          # 后者生成的英文提交列表和这个项目的双语文档风格对不上。
          # 正文一律以 docs/RELEASE_NOTES.md 为准,发版前先更新它。
          #
          # Neither `body:` nor `generate_release_notes` — the first gives an empty
          # body, the second produces an English-only commit list that does not match
          # this project's bilingual docs. The body always comes from
          # docs/RELEASE_NOTES.md, which is updated before tagging.
          body_path: docs/RELEASE_NOTES.md
